name: Refresh SEC filing index

on:
  workflow_dispatch:
  schedule:
    - cron: '17 10 * * *'

permissions:
  contents: write

concurrency:
  group: edgar-index
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v6
      - name: Fetch and validate the official SEC archive
        env:
          SEC_EDGAR_CONTACT: ${{ secrets.SEC_EDGAR_CONTACT }}
        run: |
          python3 - --output /tmp/edgar-rolling.idx.gz <<'PYTHON'
          """Build the tracker's rolling EDGAR index from SEC master archives."""

          import argparse
          from datetime import date, datetime, timedelta, timezone
          import gzip
          import io
          import json
          import re
          from pathlib import Path
          import urllib.error
          import urllib.request
          import os


          ARCHIVES = "https://www.sec.gov/Archives/edgar/full-index/"
          ASSET = "edgar-rolling.idx.gz"
          HEADER = "CIK|Company Name|Form Type|Date Filed|Filename"
          FORM = re.compile(
              r"(?:10-[KQ]|20-F|40-F|8-K|6-K|S-[1348]|F-[134]|424B[0-9]|"
              r"EFFECT|RW|DEFM14A|PREM14A|DEFA14A|425|SC TO-[TI]|SC 14D9|SC 13E3)(?:/A)?"
          )
          FILING = re.compile(r"edgar/data/\d+/\d{10}-\d{2}-\d{6}\.txt", re.IGNORECASE)
          MAX_DOWNLOAD = 25 * 1024 * 1024
          MAX_LINE = 8192


          def previous_archive(first, today):
              """Return the preceding quarter's index when the rolling window spans quarters."""
              today_quarter = (today.year, (today.month - 1) // 3 + 1)
              first_quarter = (first.year, (first.month - 1) // 3 + 1)
              if first_quarter == today_quarter:
                  return None
              year, quarter = first_quarter
              return f"{ARCHIVES}{year}/QTR{quarter}/master.gz"


          def download(url, contact):
              request = urllib.request.Request(
                  url, headers={"User-Agent": f"Biotech Listings Tracker {contact}",
                                "Accept-Encoding": "identity"}
              )
              try:
                  with urllib.request.urlopen(request, timeout=90) as response:
                      body = response.read(MAX_DOWNLOAD + 1)
              except urllib.error.HTTPError as error:
                  raise SystemExit(f"SEC download failed (HTTP {error.code}) for {url}") from None
              if len(body) > MAX_DOWNLOAD:
                  raise ValueError("SEC download exceeds the permitted file size")
              return body


          def published_days(start, today, contact):
              base = "https://www.sec.gov/Archives/edgar/daily-index/"
              quarters = {(day.year, (day.month - 1) // 3 + 1) for day in (start, today)}
              days = set()
              for year, quarter in sorted(quarters):
                  folder = download(f"{base}{year}/QTR{quarter}/", contact)
                  matches = re.findall(rb"\bmaster\.(\d{8})\.idx\b", folder)
                  days.update(datetime.strptime(day.decode(), "%Y%m%d").date() for day in matches)
              recent = {day for day in days if start <= day <= today}
              if not recent:
                  raise ValueError("No published master files found in the SEC daily index directory")
              return recent


          def parse_archive(body, start, today):
              """Validate the SEC header and retain the forms the two Sheets jobs use."""
              records = {}
              seen_header = False
              through = date.min
              filing_days = set()
              with gzip.GzipFile(fileobj=io.BytesIO(body)) as compressed:
                  stream = io.TextIOWrapper(compressed, encoding="utf-8", errors="replace")
                  for raw in stream:
                      if len(raw) > MAX_LINE:
                          raise ValueError("Unexpectedly long SEC index line")
                      line = raw.rstrip("\r\n")
                      if not seen_header:
                          seen_header = line.replace("File Name", "Filename").strip() == HEADER
                          continue
                      fields = line.split("|")
                      if len(fields) != 5:
                          continue
                      cik, issuer, form, filed, path = fields
                      if not cik.isascii() or not cik.isdecimal() or not issuer or not FILING.fullmatch(path):
                          continue
                      try:
                          filed_date = date.fromisoformat(filed)
                      except ValueError:
                          continue
                      if filed_date > today:
                          raise ValueError("SEC index contains a future filing date")
                      through = max(through, filed_date)
                      if filed_date >= start:
                          filing_days.add(filed_date)
                      if filed_date < start or not FORM.fullmatch(form):
                          continue
                      records[(path.lower(), cik, form)] = (cik, issuer, form, filed_date.isoformat(), path)
              if not seen_header or through == date.min:
                  raise ValueError("SEC master index header or filings missing")
              return through, records, filing_days


          def main():
              parser = argparse.ArgumentParser(description=__doc__)
              parser.add_argument("--as-of", type=date.fromisoformat, default=datetime.now(timezone.utc).date())
              parser.add_argument("--source", type=Path, action="append", help="Official gzip fixture, oldest first")
              parser.add_argument("--output", type=Path, default=Path(ASSET))
              args = parser.parse_args()
              start = args.as_of - timedelta(days=45)
              if args.source:
                  published = set()
                  sources = (p.read_bytes() for p in args.source)
              else:
                  contact = os.environ.get("SEC_EDGAR_CONTACT", "").strip()
                  if not re.fullmatch(r"[^\s@]+@[^\s@]+\.[^\s@]+", contact):
                      parser.error("set SEC_EDGAR_CONTACT to a monitored email address")
                  preceding = previous_archive(start, args.as_of)
                  urls = [preceding, ARCHIVES + "master.gz"] if preceding else [ARCHIVES + "master.gz"]
                  sources = (download(url, contact) for url in urls)
                  published = published_days(start, args.as_of, contact)

              through = date.min
              records = {}
              filing_days = set()
              for source in sources:
                  filed_through, items, dates = parse_archive(source, start, args.as_of)
                  through = max(through, filed_through)
                  records.update(items)
                  filing_days.update(dates)
              if through < args.as_of - timedelta(days=6) or not records:
                  raise SystemExit("SEC index is stale or contains no matching filing forms")

              ordered = sorted(records.values(), key=lambda row: (row[3], row[0], row[4], row[2]))
              source = {
                  "url": ARCHIVES + "master.gz",
                  "checked": args.as_of.isoformat() if published else "",
                  "published": max(published).isoformat() if published else "",
                  "missing": [day.isoformat() for day in sorted(published - filing_days)],
              }
              prefix = f"EDGAR source: {json.dumps(source, separators=(',', ':'))}\nEDGAR coverage: {start}|{through}\n{HEADER}\n"
              payload = prefix + "".join("|".join(record) + "\n" for record in ordered)
              compressed = gzip.compress(payload.encode("utf-8"), mtime=0)
              args.output.parent.mkdir(parents=True, exist_ok=True)
              temporary = args.output.with_suffix(args.output.suffix + ".tmp")
              temporary.write_bytes(compressed)
              temporary.replace(args.output)
              print(f"{len(ordered):,} tracked-form filing records; full-index coverage through {through}")


          if __name__ == "__main__":
              main()
          PYTHON
      - name: Publish the validated public archive
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          asset=/tmp/edgar-rolling.idx.gz
          if gh release view edgar-index >/dev/null 2>&1; then
            gh release upload edgar-index "$asset" --clobber
          else
            gh release create edgar-index "$asset" --title 'Current SEC filing index' --notes 'A rolling selection of public filing metadata from SEC EDGAR.'
          fi
          sha256sum "$asset" | cut -d ' ' -f 1 > index.sha256
          if ! git diff --quiet -- index.sha256 || ! git ls-files --error-unmatch index.sha256 >/dev/null 2>&1; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add index.sha256
            git commit -m 'Record refreshed public EDGAR index'
            git push
          fi
      - name: Reuse the previous public filing screen
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release download edgar-index --pattern edgar-reference.json \
            --output /tmp/previous-edgar-reference.json || true
      - name: Screen recent public SEC filings
        timeout-minutes: 13
        env:
          SEC_EDGAR_CONTACT: ${{ secrets.SEC_EDGAR_CONTACT }}
        run: |
          python3 - <<'REFERENCE_PY'
          """Publish public SEC issuer identifiers and explicit recent financing terms."""

          from calendar import monthrange
          from datetime import date, datetime, timedelta, timezone
          from gzip import open as gzip_open
          from html import unescape
          from html.parser import HTMLParser
          import json
          import os
          from pathlib import Path
          import re
          import time
          from concurrent.futures import ThreadPoolExecutor
          from threading import Lock
          from urllib.request import Request, urlopen


          TODAY = datetime.now(timezone.utc).date()
          TICKER_URL = "https://www.sec.gov/files/company_tickers_exchange.json"
          ARCHIVES = "https://www.sec.gov/Archives/"
          ACCESSION = re.compile(r"^\d{10}-\d{2}-\d{6}$")
          AMOUNT = r"((?:US|U\.S\.|C|CA|CAD|A|AUD|NZ|HK)?\$)\s*([\d,]+(?:\.\d+)?)\s*(billion|million|thousand)?"
          SHARES = r"([\d,]+)\s+shares"
          CLOSING = re.compile(
              r"\b(?:announc\w+ (?:the |it had )?clos(?:ing|ed)|closed|completed|consummated)\b"
              r"[^.!?;]{0,115}\b(?:offering|private placement|financing|credit facility)\b"
              r"|\b(?:offering|private placement|financing|credit facility)\b[^.!?;]{0,75}"
              r"\b(?:was|has been)\s+(?:closed|completed|consummated)\b", re.I
          )
          PROSPECTIVE = re.compile(r"\b(?:not|expect(?:s|ed)?\s+to|will|to be|subject to|if|intends? to|in order to)\b", re.I)

          class FilingText(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.parts = []
                  self.hidden = 0

              def handle_starttag(self, tag, attrs):
                  if tag in ("style", "script", "ix:header"):
                      self.hidden += 1

              def handle_endtag(self, tag):
                  if tag in ("style", "script") and self.hidden:
                      self.hidden -= 1

              def handle_data(self, data):
                  if not self.hidden:
                      self.parts.append(data)

              def text(self):
                  return " ".join(unescape(" ".join(self.parts)).split())


          def fetch(url, contact, cap=4_000_000):
              request = Request(url, headers={
                  "User-Agent": "Biotech Listings Tracker " + contact,
                  "Accept-Encoding": "identity",
                  "Accept": "application/json,text/html,*/*",
              })
              with urlopen(request, timeout=30) as response:
                  body = response.read(cap + 1)
              if len(body) > cap:
                  raise ValueError("SEC response exceeded the size limit")
              return body


          def issuer_map(contact):
              payload = json.loads(fetch(TICKER_URL, contact))
              fields = payload["fields"]
              order = [fields.index(col) for col in ("ticker", "cik", "name", "exchange")]
              issuers = [[item[i] for i in order] for item in payload["data"]
                         if item[order[0]] and item[order[1]]]
              if len(issuers) < 1000:
                  raise ValueError("Official SEC ticker map is incomplete")
              return issuers


          LOOKBACK = 9
          MAX_DOWNLOADS = 600
          CURRENT_FORMS = {"8-K", "6-K"}
          PERIODIC_FORMS = {"10-Q", "10-K", "20-F", "40-F"}
          ALLOWED_EXCHANGES = {"nasdaq", "nyse", "nyse american", "nyse arca", "cboe"}
          FILING_PATH = re.compile(r"edgar/data/\d+/\d{10}-\d{2}-\d{6}\.txt", re.I)
          DOCUMENT = re.compile(r"<DOCUMENT>\s*(.*?)</DOCUMENT>", re.I | re.S)
          MONTHS = "January February March April May June July August September October November December".split()
          MONTH_PATTERN = "|".join(MONTHS)
          CASH = r"(?:cash(?: and cash equivalents)?|liquidity|financial resources|cash runway|available capital)"
          OPERATIONS = r"(?:fund|finance|support|cover|meet|enable)\b[^.!?;]{0,105}\b(?:operations|operating|expenditures|expenses|capital requirements|cash requirements|cash needs|working capital)"
          HORIZON = re.compile(
              rf"(?P<direction>through(?: at least)?|into(?: at least)?|until|(?:at least )?to)\s+(?:the\s+)?"
              rf"(?P<period>(?:(?:end|beginning) of\s+)?(?:first|second|third|fourth) quarter (?:of )?20\d\d"
              rf"|(?:first|second) half (?:of )?20\d\d|(?:Q[1-4]|H[12])\s+20\d\d|"
              rf"(?:{MONTH_PATTERN})\s+(?:[1-3]?\d,?\s+)?20\d\d|(?:the year[- ]end of |the end of |year[- ]end |end of )?20\d\d)\b",
              re.I
          )
          CONDITIONAL = re.compile(
              r"\b(?:assum(?:es?|ing)|depend(?:s|ent|ing) on|subject to|includ(?:es?|ing)|together with|"
              r"taking into account|along with|combined with|factoring in)\b[^.;]{0,140}"
              r"\b(?:milestones?|anticipated|expected|future|potential|conditional|receipt of|proceeds from an? additional)\b",
              re.I
          )


          def latest_accessions(issuers):
              listed = {str(cik) for _, cik, _, exchange in issuers if str(exchange).lower() in ALLOWED_EXCHANGES}
              filings = {}
              cutoff = (TODAY - timedelta(days=LOOKBACK)).isoformat()
              with gzip_open("/tmp/edgar-rolling.idx.gz", "rt", encoding="utf-8") as archive:
                  source = json.loads(next(archive).split(": ", 1)[1])
                  next(archive)
                  next(archive)
                  for line in archive:
                      cik, _, form, filed, path = line.strip().split("|")
                      if cik not in listed or filed < cutoff or filed > source["published"] or not FILING_PATH.fullmatch(path):
                          continue
                      if form.removesuffix("/A") not in CURRENT_FORMS | PERIODIC_FORMS:
                          continue
                      accession = Path(path).stem
                      filings.setdefault((accession, cik), (filed, form, path))
              return source, cutoff, filings


          def calendar_horizon(match):
              direction, value = match["direction"].lower(), match["period"].lower()
              year = int(value[-4:])
              lower_bound = direction.startswith("into") or "beginning" in value
              month, span = 1, 12
              quarter = re.search(r"q([1-4])", value)
              if "quarter" in value or quarter:
                  order = ("first", "second", "third", "fourth")
                  index = int(quarter[1]) - 1 if quarter else next(i for i, name in enumerate(order) if name in value)
                  month, span = (index * 3) + 1, 3
              elif "half" in value or value.startswith(("h1", "h2")):
                  month, span = (7 if value.startswith(("second", "h2")) else 1), 6
              else:
                  for index, name in enumerate(MONTHS, 1):
                      if value.startswith(name.lower()):
                          month, span = index, 1
                          day = re.match(r"\w+ ([1-3]?\d),? 20\d\d", value)
                          if day:
                              try:
                                  return date(year, month, int(day[1])).isoformat()
                              except ValueError:
                                  return None
                          break
              if lower_bound and not value.startswith(("end of", "the end of", "year-end", "year end")):
                  return date(year, month, 1).isoformat()
              end_month = month + span - 1
              return date(year, end_month, monthrange(year, end_month)[1]).isoformat()


          def runway_terms(text, filed):
              sentences = re.split(r"(?<=[!?])\s+|(?<=\.)\s+(?=[A-Z])", text)
              matches = {}
              for section in sentences:
                  if len(section) > 1800 or not re.search(CASH, section, re.I):
                      continue
                  if re.search(r"\b(?:was expected|previously expected|no longer expects|not (?:be )?sufficient|"
                               r"might not be sufficient|not sufficient|if we (?:raise|obtain))\b", section, re.I):
                      continue
                  horizon = HORIZON.search(section)
                  context = section[:horizon.start()] if horizon else ""
                  if not (re.search(OPERATIONS, context, re.I) or re.search(r"\bcash runway\b", context, re.I)):
                      continue
                  date_text = calendar_horizon(horizon)
                  if not date_text or not filed < date_text <= str(int(filed[:4]) + 6) + "-12-31":
                      continue
                  evidence = section.strip()
                  if len(evidence) > 540:
                      continue
                  candidate = {"through": date_text, "published": horizon[0], "conditional": bool(CONDITIONAL.search(evidence)),
                               "evidence": evidence}
                  matches[date_text] = candidate
              return list(matches.values())


          def one_match(pattern, passage, amount=False):
              seen = set()
              for match in re.finditer(pattern, passage, re.I):
                  if amount:
                      raw = match[2].replace(",", "")
                      units = {None: 1, "thousand": 1_000, "million": 1_000_000, "billion": 1_000_000_000}
                      currency = {"US$": "USD", "U.S.$": "USD", "C$": "CAD", "CA$": "CAD", "CAD$": "CAD",
                                  "A$": "AUD", "AUD$": "AUD", "NZ$": "NZD", "HK$": "HKD"}.get(match[1].upper(), "$ as stated")
                      key = (match[3] or "").lower() or None
                      seen.add((round(float(raw) * units[key], 2), currency))
                  else:
                      seen.add(int(match[1].replace(",", "")))
              return seen.pop() if len(seen) == 1 else None


          def closed_terms(text):
              for closed in CLOSING.finditer(text):
                  if PROSPECTIVE.search(text[max(0, closed.start() - 45):closed.end()]):
                      continue
                  nearby = text[max(0, closed.start() - 60):closed.end() + 1400]
                  gross = one_match(r"gross proceeds\s+(?:were|of|totaled|amounted to|from the offering were|to the company were)\s+(?:approximately\s+)?" + AMOUNT, nearby, True)
                  net = one_match(r"net proceeds\s+(?:were|of|totaled|amounted to|from the offering were|to the company were)\s+(?:approximately\s+)?" + AMOUNT, nearby, True)
                  common = one_match(r"(?:issued and sold|sold|issued|offering of)\s+(?:an aggregate of\s+)?" + SHARES + r"\s+of\s+(?:the company's\s+)?common stock", nearby)
                  warrants = one_match(r"warrants to purchase\s+(?:up to\s+|an aggregate of\s+)?" + SHARES, nearby)
                  pre = one_match(SHARES + r"\s+(?:of common stock\s+)?(?:were\s+)?outstanding\s+immediately before (?:the financing|the offering|the closing)", nearby)
                  stated = "gross proceeds" if gross is not None else "net proceeds" if net is not None else "equity securities"
                  if all(value is None for value in (gross, net, common, warrants)):
                      continue
                  if gross and net and (gross[1] != net[1] or net[0] > gross[0]):
                      net = None
                  result = {"gross": gross[0] if gross else None, "net": net[0] if net else None,
                            "currency": (gross or net or (None, ""))[1],
                            "common": common, "warrants": warrants, "prior_shares": pre,
                            "basis": "Closing language and " + stated + " disclosed"}
                  if pre and common is not None and warrants is not None:
                      result["max_share_increase"] = round((common + warrants) / pre, 6)
                  return result
              return None


          def scan_filing(key, filing, fetch_slot):
              accession, cik = key
              filed, form, path = filing
              record = {"accession": accession, "cik": cik, "filed": filed, "form": form,
                        "url": ARCHIVES + path, "status": "Review needed"}
              try:
                  body = fetch_slot(path).decode("utf-8", errors="replace")
              except (OSError, ValueError) as error:
                  record["issue"] = exc_status(error)
                  return record
              records = []
              cash = []
              seen = 0
              for block in DOCUMENT.findall(body):
                  kind = re.search(r"^<TYPE>([^\r\n]+)", block, re.M | re.I)
                  filename = re.search(r"^<FILENAME>([^\r\n]+)", block, re.M | re.I)
                  payload = re.search(r"<TEXT>(.*?)</TEXT>", block, re.S | re.I)
                  if not kind or not filename or not payload:
                      continue
                  kind, filename = kind[1].strip().upper(), filename[1].strip()
                  if kind != form and not re.fullmatch(r"EX-99(?:\.\d+)?", kind):
                      continue
                  if not re.fullmatch(r"[A-Za-z0-9_.-]+\.(?:html?|txt)", filename):
                      continue
                  if kind == form:
                      seen += 1
                  url = f"{ARCHIVES}edgar/data/{cik}/{accession.replace('-', '')}/{filename}"
                  parser = FilingText()
                  parser.feed(payload[1])
                  text = parser.text().replace("’", "'")
                  if form.removesuffix("/A") in CURRENT_FORMS:
                      terms = closed_terms(text)
                      if terms:
                          records.append({"url": url, **terms})
                  cash.extend({"url": url, **term} for term in runway_terms(text, filed))
              if not seen:
                  record["issue"] = "Primary text missing"
                  return record
              record["status"] = "Screened"
              if records:
                  # Prefer the source that explicitly reports the most terms.
                  record["closing"] = max(records, key=lambda x: sum(x.get(field) is not None for field in
                                           ("gross", "net", "common", "warrants", "prior_shares")))
              horizons = {item["through"] for item in cash}
              if len(horizons) == 1:
                  record["runway"] = sorted(cash, key=lambda x: (not x["conditional"], len(x["evidence"])))[0]
              elif horizons:
                  record["runway_review"] = "More than one explicit runway horizon in the filing and exhibits"
              return record


          def review(issuers, contact):
              source, start, filings = latest_accessions(issuers)
              previous = Path("/tmp/previous-edgar-reference.json")
              try:
                  cache = json.loads(previous.read_text(encoding="utf-8")).get("review", {})
                  if cache.get("version") != 2:
                      cache = {}
              except (OSError, ValueError):
                  cache = {}
              kept = {(row["accession"], row["cik"]): row for row in cache.get("filings", [])
                      if row.get("status") == "Screened" and (row["accession"], row["cik"]) in filings}
              todo = [(key, value) for key, value in sorted(filings.items(), key=lambda pair: pair[1][0], reverse=True)
                      if key not in kept]
              gate = Lock()
              next_request = 0.0

              def fetch_slot(path):
                  nonlocal next_request
                  with gate:
                      time.sleep(max(0, next_request - time.monotonic()))
                      next_request = time.monotonic() + 0.37
                  return fetch(ARCHIVES + path, contact, 7_000_000)

              with ThreadPoolExecutor(max_workers=5) as pool:
                  incoming = list(pool.map(lambda job: scan_filing(*job, fetch_slot), todo[:MAX_DOWNLOADS]))
              kept.update({(row["accession"], row["cik"]): row for row in incoming})
              for key, (filed, form, path) in todo[MAX_DOWNLOADS:]:
                  kept[key] = {"accession": key[0], "cik": key[1], "filed": filed, "form": form,
                               "url": ARCHIVES + path, "status": "Queued"}
              records = list(kept.values())
              screened = sum(row["status"] == "Screened" for row in records)
              return {"version": 2, "start": start, "through": source["published"], "missing": source.get("missing", []),
                      "filings": records, "eligible": len(records), "screened": screened,
                      "pending": len(records) - screened, "requests": len(incoming)}


          def main():
              contact = os.environ["SEC_EDGAR_CONTACT"]
              mapping = issuer_map(contact)
              results = review(mapping, contact)
              closings = [{key: row[key] for key in ("accession", "cik", "filed", "form")} | row["closing"]
                          for row in results["filings"] if "closing" in row]
              output = {"checked": TODAY.isoformat(), "issuers": mapping, "review": results,
                        "financing": {"status": "Limited" if results["pending"] or results["missing"] else "Complete",
                                      "candidate_count": results["eligible"], "scanned": results["screened"],
                                      "failed": results["pending"]},
                        "closed_financings": closings}
              Path("/tmp/edgar-reference.json").write_text(json.dumps(output, separators=(",", ":")), encoding="utf-8")
              runway = sum("runway" in row for row in results["filings"])
              print(f"{len(mapping):,} official ticker entries; {results['screened']}/{results['eligible']} public filings screened, "
                    f"{results['requests']} fresh requests, {len(closings)} closings and {runway} explicit runway statements; "
                    f"archive through {results['through']}.")


          def exc_status(error):
              code = getattr(error, "code", "")
              return f"HTTP {code}" if code else type(error).__name__


          if __name__ == "__main__":
              main()
          REFERENCE_PY
      - name: Publish the public issuer and financing reference
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload edgar-index /tmp/edgar-reference.json --clobber
